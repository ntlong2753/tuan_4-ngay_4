<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <script>
        /**
         * Lớp ElectricLamp (Bóng Đèn)
         * Thuộc tính:
         * - status: boolean (true = Bật, false = Tắt)
         * Phương thức:
         * - turnOff(): Tắt đèn
         * - turnOn(): Bật đèn
         */
        function ElectricLamp() {
            // status: Trạng thái của bóng đèn. Mặc định là TẮT (false)
            let status = false;

            // Phương thức TẮT đèn
            this.turnOff = function() {
                status = false;
                console.log("Bóng đèn: TẮT");
            };

            // Phương thức BẬT đèn
            this.turnOn = function() {
                status = true;
                console.log("Bóng đèn: BẬT");
            };

            // Phương thức lấy trạng thái hiện tại (Không bắt buộc trong UML nhưng hữu ích)
            this.getStatus = function() {
                return status;
            };
        }
        /**
         * Lớp SwitchButton (Công Tắc)
         * Thuộc tính:
         * - status: boolean (Trạng thái công tắc: true = BẬT, false = TẮT)
         * - lamp: ElectricLamp (Đối tượng bóng đèn được kết nối)
         * Phương thức:
         * - connectToLamp(): Kết nối với bóng đèn
         * - switchOff(): Tắt công tắc và đèn
         * - switchOn(): Bật công tắc và đèn
         */
        function SwitchButton() {
            // status: Trạng thái công tắc. Mặc định là TẮT (false)
            let status = false;
            // lamp: Tham chiếu đến đối tượng ElectricLamp
            let lamp = null;

            // Phương thức kết nối công tắc với bóng đèn
            this.connectToLamp = function(electricLamp) {
                lamp = electricLamp;
                console.log("Công tắc đã được kết nối với bóng đèn.");
            };

            // Phương thức TẮT công tắc
            this.switchOff = function() {
                if (lamp !== null) {
                    status = false;
                    console.log("Công tắc: Tắt.");
                    lamp.turnOff(); // Điều khiển bóng đèn TẮT
                } else {
                    console.log("Lỗi: Công tắc chưa được kết nối với bóng đèn.");
                }
            };

            // Phương thức BẬT công tắc
            this.switchOn = function() {
                if (lamp !== null) {
                    status = true;
                    console.log("Công tắc: Bật.");
                    lamp.turnOn(); // Điều khiển bóng đèn BẬT
                } else {
                    console.log("Lỗi: Công tắc chưa được kết nối với bóng đèn.");
                }
            };

            // Phương thức lấy trạng thái hiện tại của công tắc (Không bắt buộc trong UML)
            this.getStatus = function() {
                return status;
            };
        }
        // --- BẮT ĐẦU KỊCH BẢN CHƯƠNG TRÌNH ---
        console.log("==========================================");
        console.log("BẮT ĐẦU MÔ PHỎNG CÔNG TẮC VÀ BÓNG ĐÈN");
        console.log("==========================================");

        // 1. Khai báo và khởi tạo đối tượng
        let switchButton = new SwitchButton();
        let electricLamp = new ElectricLamp();

        // 2. Kết nối công tắc với bóng đèn
        switchButton.connectToLamp(electricLamp);

        console.log("\n--- THỰC HIỆN BẬT/TẮT 10 LẦN ---");

        let totalTurns = 10;
        for (let i = 1; i <= totalTurns; i++) {
            console.log("------------------------------------------");
            console.log("Lần thứ " + i + ":");

            // Lần chẵn (2, 4, 6...) sẽ TẮT, Lần lẻ (1, 3, 5...) sẽ BẬT
            if (i % 2 !== 0) {
                // Lần lẻ: BẬT
                switchButton.switchOn();
            } else {
                // Lần chẵn: TẮT
                switchButton.switchOff();
            }
        }

        console.log("==========================================");
        console.log("KẾT THÚC MÔ PHỎNG.");
        console.log("Trạng thái cuối cùng của Công tắc: " + (switchButton.getStatus() ? "BẬT" : "TẮT"));
        console.log("Trạng thái cuối cùng của Bóng đèn: " + (electricLamp.getStatus() ? "BẬT" : "TẮT"));
    </script>
</body>
</html>
