<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Bàn cờ 20x20</title>

</head>
<body>
    <div id="board"></div>
    <style>
        #board {
            position: relative;
            width: 400px;     /* 20 ô × 20px */
            height: 400px;
            border: 2px solid #000;
        }

        .cell {
            position: absolute;
            width: 20px;
            height: 20px;
        }
</style>
    <div class="board">
        <!-- 400 ô vuông -->
    </div>
</body>
</html>
